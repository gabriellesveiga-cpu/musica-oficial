import { db } from "./firebase.js";

import {
    ref,
    push,
    set
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

async function criarPlaylist(nome) {

    const novaPlaylist = push(ref(db, "playlists"));

    await set(novaPlaylist, {
        nome: nome,
        musicas: {}
    });

}
