
<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spotfy/Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <div id="cadastro">

        <img
            src="../logo.png"
            alt="Spotify"
            class="logo"
        >

        <h1>Logar</h1>


        <p>Email:</p>

        <input
            type="email"
            id="emailLogin"
            class="email"
        >


        <p>Senha:</p>

        <input
            type="password"
            id="passwordLogin"
            class="password"
        >


        <button
            id="login"
            class="bnt-in"
        >
            Entrar
        </button>


        <a href="./cadastrar.html">
            Não possuo cadastro
        </a>

    </div>


    <script
        type="module"
        src="../js/main.js"
    ></script>

</body>
